# Supabase CLI configuration — local development.
# One hosted project: agma-os-production (owner decision 2026-08-06).
# Migrations are proven on the local stack (supabase start + db reset) before
# any `supabase db push` to production — see supabase/README.md.
project_id = "agma-os"

# Local-stack log analytics (Logflare) — not needed for migration testing and
# flaky on some Docker setups; keep disabled.
[analytics]
enabled = false

# TOTP 2FA — mandatory for team roles (docs/05 §B11.4). Hosted project:
# verify Auth → Multi-Factor is enabled in the dashboard too.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Public form endpoint — validates input itself; no user JWT exists on the
# marketing site.
[functions.lead-intake]
verify_jwt = false
