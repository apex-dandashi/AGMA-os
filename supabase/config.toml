# Supabase CLI configuration — local development.
# One hosted project: agma-os-production (owner decision 2026-08-06).
# Migrations are proven on the local stack (supabase start + db reset) before
# any `supabase db push` to production — see supabase/README.md.
project_id = "agma-os"

# Local-stack log analytics (Logflare) — not needed for migration testing and
# flaky on some Docker setups; keep disabled.
[analytics]
enabled = false

# Auth URL configuration — mirrors Authentication → URL Configuration on the
# hosted project (corrected 2026-08-08). site_url had been left at Supabase's
# default http://localhost:3000, so GoTrue discarded the redirectTo the app
# sends and every password-reset email pointed at localhost.
#
# site_url deliberately stays the production ops URL: it is only the fallback
# used when a request carries no redirectTo (or one that isn't allow-listed),
# and both apps always pass an explicit redirectTo. Local dev keeps working
# through additional_redirect_urls, and `supabase config push` can't reinstate
# the localhost fallback on production.
[auth]
site_url = "https://ops.agma.com.sa"
additional_redirect_urls = [
  "https://ops.agma.com.sa/**",
  "https://agma.com.sa/**",
  "https://staging.agma.com.sa/**",
  "http://localhost:3001/**", # ops dev server
  "http://localhost:3000/**", # marketing dev server
]

# TOTP 2FA — mandatory for team roles (docs/05 §B11.4). Hosted project:
# verify Auth → Multi-Factor is enabled in the dashboard too.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Public form endpoint — validates input itself; no user JWT exists on the
# marketing site.
[functions.lead-intake]
verify_jwt = false

# Public error sink — browser errors carry no user JWT.
[functions.client-errors]
verify_jwt = false

# Public voice/careers forms — same rationale as lead-intake.
[functions.public-forms]
verify_jwt = false

# Public lead-magnet website audit + cron-invoked site monitor (L9).
[functions.website-audit]
verify_jwt = false

[functions.site-monitor]
verify_jwt = false

# AGMA Live public aggregates — anonymized, cached (L9).
[functions.live-stats]
verify_jwt = false

# الجمع اليومي للمقالات — يستدعيه cron عبر pg_net بلا توثيق؛ لا يقبل مدخلات (L9).
[functions.content-collect]
verify_jwt = false
